apiVersion: 1

datasources:
  - name: Dify PostgreSQL
    uid: dify-postgres
    type: postgres
    access: proxy
    url: "${DIFY_DB_HOST}:${DIFY_DB_PORT}"
    user: "${DIFY_DB_USER}"
    secureJsonData:
      password: "${DIFY_DB_PASSWORD}"
    jsonData:
      database: "${DIFY_DB_NAME}"
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 5
      connMaxLifetime: 14400
      postgresVersion: 1500
      timescaledb: false
    isDefault: false
    editable: false

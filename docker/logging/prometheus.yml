global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    env: prod

rule_files:
  - /etc/prometheus/rules/dify_alerts.yml

# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: dify-exporter
    # Exporter poll DB mỗi 30s; scrape dày hơn cũng không có dữ liệu mới.
    scrape_interval: 1m
    static_configs:
      - targets: ['dify-exporter:9192']
        labels:
          service: dify

    # --- Tuỳ chọn cắt cardinality (bỏ comment khi cần) -------

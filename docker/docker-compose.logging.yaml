services:
  # ── Log storage ─────────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.1.0
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./logging/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - docker_default
      - dify_default
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── Trace storage ────────────────────────────────────────────────────────────
  tempo:
    image: grafana/tempo:2.5.0
    restart: unless-stopped
    ports:
      - "3200:3200"    # HTTP query API
    volumes:
      - ./logging/tempo-config.yml:/etc/tempo/config.yml
      - tempo_data:/var/tempo
    command: -config.file=/etc/tempo/config.yml
    networks:
      - docker_default
      - dify_default
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3200/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── Metrics storage ──────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./logging/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - docker_default
      - dify_default
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --storage.tsdb.retention.time=7d

  # ── Collector — receives OTLP from Dify, tails log files, Docker logs ────────
  alloy:
    image: grafana/alloy:v1.3.0
    restart: unless-stopped
    ports:
      - "4317:4317"    # OTLP gRPC  ← Dify sends here
      - "4318:4318"    # OTLP HTTP  ← Dify sends here
      - "12345:12345"  # Alloy UI
    volumes:
      - ./logging/alloy-config.alloy:/etc/alloy/config.alloy
      - ${DIFY_LOG_DIR:-./volumes/logs}:/logs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker_default
      - dify_default
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --stability.level=generally-available
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy

  # ── Unified UI ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    ports:
      - "4000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_FEATURE_TOGGLES_ENABLE: "traceToMetrics traceToLogs"
      # Dify DB — used by workflow-monitor datasource provisioning
      DIFY_DB_HOST: "${DB_HOST:-db_postgres}"
      DIFY_DB_PORT: "${DB_PORT:-5432}"
      DIFY_DB_USER: "${DB_USERNAME:-postgres}"
      DIFY_DB_PASSWORD: "${DB_PASSWORD:-difyai123456}"
      DIFY_DB_NAME: "${DB_DATABASE:-dify}"
    volumes:
      - ./logging/grafana/provisioning:/etc/grafana/provisioning
      - ./logging/grafana/dashboards:/etc/grafana/dashboards
      - grafana_data:/var/lib/grafana
    networks:
      - docker_default
      - dify_default
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
  dify-exporter:
    build:
      context: ./exporters/dify-monitoring
    # hoặc dùng image đã build sẵn:
    # image: dify-exporter:1.0.0
    container_name: dify-exporter
    restart: always
    env_file:
      - ./middleware.env
    environment:
      # Ghi đè nếu không dùng env_file. Host comes from `DB_HOST` (default: db_postgres).
      # Use the same DB credentials as the middleware environment by default.
      DIFY_DB_DSN: ${DIFY_EXPORTER_DSN:-postgresql://${DB_USERNAME:-postgres}:${DB_PASSWORD:-difyai123456}@${DB_HOST:-db_postgres}:${DB_PORT:-5432}/${DB_DATABASE:-dify}}
      STATE_PATH: /var/lib/dify-exporter/state.json
      APP_MODES: workflow
      BACKFILL_DAYS: "365"
      POLL_INTERVAL_SECONDS: "30"
    volumes:
      - dify_exporter_state:/var/lib/dify-exporter
    ports:
      # Chỉ mở ra localhost — Prometheus scrape qua network nội bộ.
      # Bỏ dòng này nếu Prometheus cùng docker network.
      - "9192:9192"
    # depends_on intentionally omitted so this file can run standalone; exporter will retry DB until available
    networks:
      - docker_default
      - dify_default
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9192/metrics || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  loki_data:
  tempo_data:
  prometheus_data:
  grafana_data:
  dify_exporter_state:

networks:
  dify_default:
    external: true
  docker_default:
    external: true

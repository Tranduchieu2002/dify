upstream sandbox_pool {
    least_conn;
    server sandbox:8194;
}

server {
    listen 8194;

    location / {
        proxy_pass         http://sandbox_pool;
        proxy_read_timeout 90s;
        proxy_send_timeout 30s;
        proxy_set_header   Host $host;
    }

    location /health {
        access_log off;
        return 200 "ok\n";
    }
}

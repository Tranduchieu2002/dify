app:
  description: Benchmark - code node execution. Tests sandbox throughput under concurrent runs.
  icon: "\U0001F4BB"
  icon_background: '#F0FDF4'
  mode: workflow
  name: bench-code-execution
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_types: []
      enabled: false
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
      - data:
          isInIteration: false
          sourceType: start
          targetType: code
        id: start-code
        source: start
        sourceHandle: source
        target: code
        targetHandle: target
        type: custom
      - data:
          isInIteration: false
          sourceType: code
          targetType: end
        id: code-end
        source: code
        sourceHandle: source
        target: end
        targetHandle: target
        type: custom
    nodes:
      - data:
          desc: ''
          selected: false
          title: Start
          type: start
          variables:
            - label: query
              max_length: 500
              options: []
              required: true
              type: paragraph
              variable: query
        height: 90
        id: start
        position:
          x: 80
          y: 200
        type: custom
        width: 244
      - data:
          code: |
            def main(query: str) -> dict:
                words = query.strip().split()
                return {
                    "result": f"Processed {len(words)} words: {', '.join(reversed(words))}",
                    "word_count": len(words)
                }
          code_language: python3
          desc: Reverse words and count them
          outputs:
            result:
              children: null
              type: string
            word_count:
              children: null
              type: number
          selected: false
          title: Process Text
          type: code
          variables:
            - value_selector:
                - start
                - query
              variable: query
        height: 102
        id: code
        position:
          x: 400
          y: 200
        type: custom
        width: 244
      - data:
          desc: ''
          outputs:
            - value_selector:
                - code
                - result
              variable: result
          selected: false
          title: End
          type: end
        height: 98
        id: end
        position:
          x: 720
          y: 200
        type: custom
        width: 244
    viewport:
      x: 0
      y: 0
      zoom: 1

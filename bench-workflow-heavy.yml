app:
  description: Benchmark - heavy workflow with code execution, data processing, and simulated wait. Tests worker under real load.
  icon: "\U0001F525"
  icon_background: '#FEF3C7'
  mode: workflow
  name: bench-heavy-wait
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_types: []
      enabled: false
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
      - data:
          isInIteration: false
          sourceType: start
          targetType: code
        id: start-step1
        source: start
        sourceHandle: source
        target: step1
        targetHandle: target
        type: custom
      - data:
          isInIteration: false
          sourceType: code
          targetType: code
        id: step1-step2
        source: step1
        sourceHandle: source
        target: step2
        targetHandle: target
        type: custom
      - data:
          isInIteration: false
          sourceType: code
          targetType: code
        id: step2-step3
        source: step2
        sourceHandle: source
        target: step3
        targetHandle: target
        type: custom
      - data:
          isInIteration: false
          sourceType: code
          targetType: end
        id: step3-end
        source: step3
        sourceHandle: source
        target: end
        targetHandle: target
        type: custom
    nodes:
      - data:
          desc: ''
          selected: false
          title: Start
          type: start
          variables:
            - label: query
              max_length: 500
              options: []
              required: true
              type: paragraph
              variable: query
            - label: wait_ms
              max_length: 10
              options: []
              required: false
              type: text-input
              variable: wait_ms
        height: 90
        id: start
        position:
          x: 80
          y: 280
        type: custom
        width: 244

      - data:
          code: |
            import time
            import hashlib

            def main(query: str, wait_ms: str) -> dict:
                wait = int(wait_ms) / 1000.0 if wait_ms else 0.5

                # Simulate CPU work
                data = query * 10
                for _ in range(500):
                    hashlib.sha256(data.encode()).hexdigest()

                # Simulate I/O wait (DB call, external API, etc.)
                time.sleep(wait)

                words = query.strip().split()
                return {
                    "step1_result": f"Processed {len(words)} words",
                    "checksum": hashlib.sha256(query.encode()).hexdigest()[:16],
                    "waited_ms": int(wait * 1000),
                }
          code_language: python3
          desc: CPU work + I/O wait simulation
          outputs:
            step1_result:
              children: null
              type: string
            checksum:
              children: null
              type: string
            waited_ms:
              children: null
              type: number
          selected: false
          title: Step 1 — Process & Wait
          type: code
          variables:
            - value_selector:
                - start
                - query
              variable: query
            - value_selector:
                - start
                - wait_ms
              variable: wait_ms
        height: 102
        id: step1
        position:
          x: 400
          y: 280
        type: custom
        width: 244

      - data:
          code: |
            import time
            import json

            def main(step1_result: str, checksum: str, waited_ms: int) -> dict:
                # Simulate a second async step (e.g. writing to DB)
                time.sleep(0.2)

                payload = {
                    "source": step1_result,
                    "checksum": checksum,
                    "total_waited_ms": waited_ms + 200,
                    "status": "enriched",
                }
                return {
                    "step2_result": json.dumps(payload),
                    "total_waited_ms": waited_ms + 200,
                }
          code_language: python3
          desc: Enrich result + second wait
          outputs:
            step2_result:
              children: null
              type: string
            total_waited_ms:
              children: null
              type: number
          selected: false
          title: Step 2 — Enrich
          type: code
          variables:
            - value_selector:
                - step1
                - step1_result
              variable: step1_result
            - value_selector:
                - step1
                - checksum
              variable: checksum
            - value_selector:
                - step1
                - waited_ms
              variable: waited_ms
        height: 102
        id: step2
        position:
          x: 720
          y: 280
        type: custom
        width: 244

      - data:
          code: |
            import time

            def main(step2_result: str, total_waited_ms: int) -> dict:
                # Final aggregation step
                time.sleep(0.1)
                return {
                    "final": f"Done. Total simulated wait: {total_waited_ms + 100}ms",
                    "summary": step2_result,
                }
          code_language: python3
          desc: Final aggregation
          outputs:
            final:
              children: null
              type: string
            summary:
              children: null
              type: string
          selected: false
          title: Step 3 — Aggregate
          type: code
          variables:
            - value_selector:
                - step2
                - step2_result
              variable: step2_result
            - value_selector:
                - step2
                - total_waited_ms
              variable: total_waited_ms
        height: 102
        id: step3
        position:
          x: 1040
          y: 280
        type: custom
        width: 244

      - data:
          desc: ''
          outputs:
            - value_selector:
                - step3
                - final
              variable: result
          selected: false
          title: End
          type: end
        height: 98
        id: end
        position:
          x: 1360
          y: 280
        type: custom
        width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.8

app:
  description: Benchmark - fast passthrough, no LLM, no code. Tests raw Celery queue throughput.
  icon: "\U0001F680"
  icon_background: '#E0F2FE'
  mode: workflow
  name: bench-fast-passthrough
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_types: []
      enabled: false
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
      - data:
          isInIteration: false
          sourceType: start
          targetType: end
        id: start-end
        source: start
        sourceHandle: source
        target: end
        targetHandle: target
        type: custom
    nodes:
      - data:
          desc: ''
          selected: false
          title: Start
          type: start
          variables:
            - label: query
              max_length: 500
              options: []
              required: true
              type: paragraph
              variable: query
        height: 90
        id: start
        position:
          x: 80
          y: 200
        positionAbsolute:
          x: 80
          y: 200
        type: custom
        width: 244
      - data:
          desc: ''
          outputs:
            - value_selector:
                - start
                - query
              variable: result
          selected: false
          title: End
          type: end
        height: 98
        id: end
        position:
          x: 420
          y: 200
        positionAbsolute:
          x: 420
          y: 200
        type: custom
        width: 244
    viewport:
      x: 0
      y: 0
      zoom: 1
